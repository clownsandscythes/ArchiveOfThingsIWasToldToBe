<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>archive of things I was told to be</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 6vh; text-align: center;
    font: 300 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .04em; color: rgba(255,255,255,.45);
    transition: opacity 1.2s ease; pointer-events: none;
  }
  #hint.gone { opacity: 0; }
  #writer {
    position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%);
    display: none; gap: 8px; width: min(560px, 92vw);
  }
  #writer.on { display: flex; }
  #writer input {
    flex: 1; min-width: 0; font: 18px "Times New Roman", Times, serif; color: #fff;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.28);
    border-radius: 6px; padding: 10px 12px; outline: none;
  }
  #writer input:focus { border-color: rgba(255,255,255,.6); }
  #writer button {
    font: 14px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28); border-radius: 6px; padding: 0 14px; cursor: pointer;
  }
  #writer button:disabled { opacity: .35; cursor: default; }
  #shelf { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); display: none; }
  #shelf.on { display: block; }
  #shelf button {
    font: 14px system-ui, sans-serif; color: #fff; background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.28); border-radius: 6px; padding: 10px 22px; cursor: pointer;
  }
  #count {
    position: fixed; left: 20px; bottom: 20px; pointer-events: none;
    font: 300 13px system-ui, sans-serif; letter-spacing: .04em; color: rgba(255,255,255,.4);
  }
</style>
</head>
<body>
<canvas id="c" aria-label="A cardboard box labelled 'archive of things I was told to be', with a slit in the top, sitting on a dark floor with sticky notes scattered around it and a stack of notes beside it. Drag to look around; click the stack to write a note and post it through the slit; click the box to empty it and read the notes."></canvas>
<div id="hint">Drag to look around · tap the stack of notes to write one</div>
<div id="writer">
  <input id="field" type="text" maxlength="80" placeholder="something you were told to be" autocomplete="off">
  <button id="post" disabled>Post it</button>
  <button id="back">Put back</button>
</div>
<div id="shelf"><button id="close">Close</button></div>
<div id="count"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('c');
  var hint = document.getElementById('hint');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 9, 18);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);

  // everything that sits on the floor turns together
  var world = new THREE.Group();
  scene.add(world);
  var FLOOR = -1;                       // the box is 2 tall and centred on 0

  // ---------- cardboard textures ----------
  function cardboard(draw) {
    var c = document.createElement('canvas');
    c.width = c.height = 1024;
    var g = c.getContext('2d');
    g.fillStyle = '#b48a5a';
    g.fillRect(0, 0, 1024, 1024);
    for (var i = 0; i < 9000; i++) {
      var light = Math.random() > 0.5;
      g.fillStyle = light ? 'rgba(255,232,190,' + (Math.random() * 0.09) + ')'
                          : 'rgba(80,50,22,' + (Math.random() * 0.10) + ')';
      g.fillRect(Math.random() * 1024, Math.random() * 1024, 1 + Math.random() * 14, 1 + Math.random() * 2);
    }
    for (var y = 0; y < 1024; y += 8) {
      g.fillStyle = 'rgba(70,42,18,0.055)';
      g.fillRect(0, y, 1024, 3);
    }
    var grad = g.createRadialGradient(512, 512, 380, 512, 512, 760);
    grad.addColorStop(0, 'rgba(60,35,12,0)');
    grad.addColorStop(1, 'rgba(60,35,12,0.28)');
    g.fillStyle = grad; g.fillRect(0, 0, 1024, 1024);
    if (draw) draw(g);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  function writeLabel(g) {
    g.save();
    g.translate(512, 512);
    g.rotate(-0.04);
    g.fillStyle = 'rgba(28,22,18,0.92)';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '128px "Times New Roman", Times, serif';
    g.fillText('archive of', 0, -170);
    g.fillText('things I was', 0, -35);
    g.fillText('told to be', 0, 100);
    g.restore();
  }

  var frontTex = cardboard(writeLabel);
  var sideTex = function () { return cardboard(null); };

  // BoxGeometry face order: +x, -x, +y (top, replaced), -y, +z (front), -z
  function side(map) {
    return new THREE.MeshStandardMaterial({ map: map, roughness: 0.95, metalness: 0 });
  }
  var hiddenTop = new THREE.MeshBasicMaterial({ visible: false });
  var mats = [side(sideTex()), side(sideTex()), hiddenTop, side(sideTex()), side(frontTex), side(sideTex())];

  var box = new THREE.Group();
  box.add(new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mats));
  box.add(new THREE.Mesh(
    new THREE.BoxGeometry(1.96, 1.96, 1.96),
    new THREE.MeshBasicMaterial({ color: 0x090604, side: THREE.BackSide })
  ));

  // top face with a real slit, centred
  var top = new THREE.Shape();
  top.moveTo(-1, -1); top.lineTo(1, -1); top.lineTo(1, 1); top.lineTo(-1, 1); top.lineTo(-1, -1);
  var slit = new THREE.Path();
  var sx = 0.62, sy = 0.04;
  slit.moveTo(-sx, -sy); slit.lineTo(sx, -sy); slit.lineTo(sx, sy); slit.lineTo(-sx, sy); slit.lineTo(-sx, -sy);
  top.holes.push(slit);

  var topTex = cardboard(function (g) {
    g.fillStyle = 'rgba(40,24,8,0.55)'; g.fillRect(0, 509, 1024, 6);
    g.fillStyle = 'rgba(255,235,200,0.22)'; g.fillRect(0, 515, 1024, 3);
  });
  topTex.repeat.set(0.5, 0.5);
  topTex.offset.set(0.5, 0.5);

  var topMesh = new THREE.Mesh(
    new THREE.ShapeGeometry(top),
    new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.95, metalness: 0, side: THREE.DoubleSide })
  );
  topMesh.rotation.x = -Math.PI / 2;
  topMesh.position.y = 1.0;
  box.add(topMesh);
  box.rotation.y = -0.45;
  world.add(box);

  // ---------- the floor: a soft pool of light in the void, plus a contact shadow ----------
  function radialTexture(stops) {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    stops.forEach(function (s) { rg.addColorStop(s[0], s[1]); });
    g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function flatDisc(size, tex, y, order) {
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(size, size),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: false })
    );
    m.rotation.x = -Math.PI / 2; m.position.y = y; m.renderOrder = order;
    return m;
  }
  scene.add(flatDisc(15, radialTexture([[0, 'rgba(70,64,58,0.85)'], [0.55, 'rgba(38,34,30,0.55)'], [1, 'rgba(0,0,0,0)']]), FLOOR, -2));
  scene.add(flatDisc(3.8, radialTexture([[0, 'rgba(0,0,0,0.9)'], [0.55, 'rgba(0,0,0,0.6)'], [1, 'rgba(0,0,0,0)']]), FLOOR + 0.002, -1));

  // ---------- sticky notes lying on the floor ----------
  var palette = ['#f6e27a', '#f4a6b8', '#9fd3e8', '#b4e0a0', '#f7c58c', '#f6e27a'];

  function noteTexture(hex) {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var g = c.getContext('2d');
    g.fillStyle = hex; g.fillRect(0, 0, 256, 256);
    var shade = g.createLinearGradient(0, 0, 0, 256);
    shade.addColorStop(0, 'rgba(255,255,255,0.10)');
    shade.addColorStop(1, 'rgba(0,0,0,0.10)');
    g.fillStyle = shade; g.fillRect(0, 0, 256, 256);
    g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(0, 0, 256, 44);
    g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0, 44, 256, 2);
    for (var i = 0; i < 1400; i++) {
      g.fillStyle = 'rgba(' + (Math.random() > 0.5 ? '255,255,255' : '0,0,0') + ',' + (Math.random() * 0.05) + ')';
      g.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 3, 1);
    }
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---------- a stack of sticky notes on the floor, beside the box ----------
  var STACK = { x: 2.15, z: 0.9 };
  var texCache = {};
  function cachedNoteTexture(hex) { return texCache[hex] || (texCache[hex] = noteTexture(hex)); }

  var stackGroup = new THREE.Group();
  var stackSheets = [];
  var SHEET = 0.012, SHEETS = 16;
  for (var si = 0; si < SHEETS; si++) {
    var hex = palette[(si * 5 + 1) % palette.length];
    var edge = new THREE.MeshStandardMaterial({ color: new THREE.Color(hex).multiplyScalar(0.82), roughness: 0.95, metalness: 0 });
    var faceMat = new THREE.MeshStandardMaterial({ map: cachedNoteTexture(hex), roughness: 0.9, metalness: 0 });
    var sheet = new THREE.Mesh(
      new THREE.BoxGeometry(0.62, SHEET, 0.62),
      [edge, edge, faceMat, edge, edge, edge]
    );
    sheet.position.set((Math.random() - 0.5) * 0.05, SHEET / 2 + si * SHEET * 1.02, (Math.random() - 0.5) * 0.05);
    sheet.rotation.y = (Math.random() - 0.5) * 0.28;
    sheet.userData.hex = hex;
    stackGroup.add(sheet);
    stackSheets.push(sheet);
  }
  stackGroup.position.set(STACK.x, FLOOR + 0.003, STACK.z);
  stackGroup.rotation.y = 0.5;
  world.add(stackGroup);

  var stackShadow = flatDisc(1.5, radialTexture([[0, 'rgba(0,0,0,0.75)'], [0.6, 'rgba(0,0,0,0.4)'], [1, 'rgba(0,0,0,0)']]), FLOOR + 0.002, -1);
  stackShadow.position.x = STACK.x; stackShadow.position.z = STACK.z;
  world.add(stackShadow);

  // ---------- prompts written on the scattered notes ----------
  var prompts = [
    'What were you told you should become?',
    'What did they say you should wear / study / do?',
    'The sentence that was repeated to you.',
    'What was decided for you.',
    'One thing you were told was necessary.',
    'Who did they say you were?',
    'What were you told to stop being?',
    'What were you told was too much?',
    'A rule nobody explained.',
    'What were you praised for being?'
  ];
  function promptTexture(hex, text) {
    var c = document.createElement('canvas'); c.width = c.height = 512;
    drawNote(c.getContext('2d'), hex, text);
    var t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  var placed = [];
  for (var n = 0; n < 18; n++) {
    var px, pz, tries = 0, ok;
    do {
      var r = 1.9 + Math.pow(Math.random(), 1.3) * 3.6;         // denser near the box
      var a = Math.random() * Math.PI * 2;
      px = Math.cos(a) * r; pz = Math.sin(a) * r;
      ok = !(Math.abs(px) < 1.5 && Math.abs(pz) < 1.5) &&        // not under the box
           placed.every(function (q) { return Math.hypot(q[0] - px, q[1] - pz) > 0.8; }) &&
           Math.hypot(px - STACK.x, pz - STACK.z) > 1.1;     // keep clear of the stack
      tries++;
    } while (!ok && tries < 80);
    placed.push([px, pz]);

    var geo = new THREE.PlaneGeometry(0.62, 0.62, 6, 6);
    var gp = geo.attributes.position, curl = Math.random() * 0.12;
    for (var v = 0; v < gp.count; v++) {                        // one edge curls up off the floor
      var yy = (gp.getY(v) + 0.31) / 0.62;
      gp.setZ(v, curl * yy * yy * yy);
    }
    geo.computeVertexNormals();

    var note = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      map: promptTexture(palette[n % palette.length], prompts[n % prompts.length]), roughness: 0.9, metalness: 0, side: THREE.DoubleSide
    }));
    note.rotation.order = 'YXZ';
    note.rotation.x = -Math.PI / 2;                              // lie flat
    note.rotation.z = Math.random() * Math.PI * 2;               // turn on the floor
    note.position.set(px, FLOOR + 0.004 + n * 0.0006, pz);
    world.add(note);
  }

  // ---------- light ----------
  var key = new THREE.DirectionalLight(0xfff0dc, 1.15);
  key.position.set(-3, 6, 4);
  scene.add(key);
  var rim = new THREE.PointLight(0x7d92d8, 0.5, 14);
  rim.position.set(4, 1, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.3));

  // ---------- camera orbit: drag sideways to turn, up and down to tilt ----------
  var pitch = 0.5, dist = 8.5, yawVel = 0;
  var dragging = false, lastX = 0, lastY = 0;
  var idle = reduceMotion ? 0 : 0.0016;

  function placeCamera() {
    camera.position.set(0, Math.sin(pitch) * dist, Math.cos(pitch) * dist);
    camera.lookAt(0, -0.2, 0);
  }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    hint.classList.add('gone');
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yawVel = dx * 0.006;
    world.rotation.y += yawVel;
    pitch = Math.min(1.25, Math.max(0.1, pitch + dy * 0.005));
    placeCamera();
  });
  function end() { dragging = false; }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    dist = Math.min(14, Math.max(4.5, dist + e.deltaY * 0.005));
    placeCamera();
  }, { passive: false });

  // ---------- the stack is interactive: peel a note, write on it, post it through the slit ----------
  var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  var writer = document.getElementById('writer'), field = document.getElementById('field');
  var postBtn = document.getElementById('post'), backBtn = document.getElementById('back');
  var countEl = document.getElementById('count');
  var held = null, heldCanvas = null, heldTex = null, heldHex = null, heldFaceOrig = null;
  var move = null, downX = 0, downY = 0;
  var inside = [], emptying = false, tweens = [], displayList = [], displayMode = false;
  var shelf = document.getElementById('shelf');          // notes posted into the box; spill animation state
  var boxHitMeshes = [box.children[0], topMesh];            // the walls and the lid, for clicking the box
  var X_AXIS = new THREE.Vector3(1, 0, 0), Y_AXIS = new THREE.Vector3(0, 1, 0);
  var qFace = new THREE.Quaternion().setFromAxisAngle(X_AXIS, Math.PI / 2);   // turns a sheet's top face toward +z

  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function wrapText(g, str, maxW) {
    var words = str.split(/\s+/), lines = [], cur = '';
    words.forEach(function (w) {
      while (g.measureText(w).width > maxW) {                       // break very long words
        var cut = w.length;
        while (cut > 1 && g.measureText(w.slice(0, cut)).width > maxW) cut--;
        if (cur) { lines.push(cur); cur = ''; }
        lines.push(w.slice(0, cut)); w = w.slice(cut);
      }
      var test = cur ? cur + ' ' + w : w;
      if (g.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function drawNote(g, hex, text) {
    var S = 512;
    g.fillStyle = hex; g.fillRect(0, 0, S, S);
    var sh = g.createLinearGradient(0, 0, 0, S);
    sh.addColorStop(0, 'rgba(255,255,255,0.10)'); sh.addColorStop(1, 'rgba(0,0,0,0.10)');
    g.fillStyle = sh; g.fillRect(0, 0, S, S);
    g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(0, 0, S, 88);
    g.fillStyle = 'rgba(0,0,0,0.07)'; g.fillRect(0, 88, S, 3);
    var empty = !text.trim();
    var str = empty ? 'I was told to be\u2026' : text.trim();
    g.fillStyle = empty ? 'rgba(40,34,30,0.35)' : '#2a2622';
    g.textAlign = 'left'; g.textBaseline = 'top';
    var size = 64, lines;
    for (; size >= 28; size -= 4) {
      g.font = (empty ? 'italic ' : '') + size + 'px "Times New Roman", Times, serif';
      lines = wrapText(g, str, S - 100);
      if (lines.length * size * 1.15 <= 340) break;
    }
    lines.forEach(function (ln, i) { g.fillText(ln, 50, 120 + i * size * 1.15); });
  }

  // where the note should be, for each stage (recomputed every frame so it follows the camera and the turning box)
  function camTarget() {
    camera.updateMatrixWorld();
    var vh = 2 * 3.3 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    var w = Math.min(vh * 0.5, vh * camera.aspect * 0.8);
    return {
      p: camera.localToWorld(new THREE.Vector3(0, 0.12, -3.3)),
      q: camera.quaternion.clone().multiply(qFace),
      s: Math.max(1, w / 0.62)
    };
  }
  function slitTarget(y) {
    world.updateMatrixWorld(true);
    return {
      p: box.localToWorld(new THREE.Vector3(0, y, 0)),
      q: box.getWorldQuaternion(new THREE.Quaternion()).multiply(qFace),
      s: 1
    };
  }
  function boxTarget(x, y, z, yaw) {
    world.updateMatrixWorld(true);
    return {
      p: box.localToWorld(new THREE.Vector3(x, y, z)),
      q: box.getWorldQuaternion(new THREE.Quaternion()).multiply(new THREE.Quaternion().setFromAxisAngle(Y_AXIS, yaw)),
      s: 1
    };
  }
  function stackTopTarget() {
    world.updateMatrixWorld(true);
    return {
      p: stackGroup.localToWorld(new THREE.Vector3(0, SHEET / 2 + stackSheets.length * SHEET * 1.02, 0)),
      q: stackGroup.getWorldQuaternion(new THREE.Quaternion()),
      s: 1
    };
  }

  function startMove(seconds, targetFn, done) {
    move = {
      phase: 'move', t0: performance.now(), dur: seconds * 1000, targetFn: targetFn, done: done,
      p: held.position.clone(), q: held.quaternion.clone(), s: held.scale.x
    };
  }
  function stepNote() {
    if (!move || !held) return;
    if (move.phase === 'write') {
      var c = camTarget();
      held.position.copy(c.p); held.quaternion.copy(c.q); held.scale.setScalar(c.s);
      return;
    }
    var t = Math.min(1, (performance.now() - move.t0) / move.dur), k = ease(t), tg = move.targetFn();
    held.position.lerpVectors(move.p, tg.p, k);
    held.quaternion.slerpQuaternions(move.q, tg.q, k);
    held.scale.setScalar(move.s + (tg.s - move.s) * k);
    if (t >= 1) { var d = move.done; move = null; if (d) d(); }
  }

  function pickNote() {
    held = stackSheets.pop();
    heldHex = held.userData.hex;
    heldFaceOrig = held.material[2];
    heldCanvas = document.createElement('canvas'); heldCanvas.width = heldCanvas.height = 512;
    drawNote(heldCanvas.getContext('2d'), heldHex, '');
    heldTex = new THREE.CanvasTexture(heldCanvas);
    heldTex.encoding = THREE.sRGBEncoding;
    heldTex.anisotropy = 8;
    held.material[2] = new THREE.MeshStandardMaterial({
      map: heldTex, emissive: 0xffffff, emissiveMap: heldTex, emissiveIntensity: 0.45, roughness: 0.9
    });
    scene.attach(held);
    field.value = ''; postBtn.disabled = true;
    startMove(0.8, camTarget, function () {
      move = { phase: 'write' };
      writer.classList.add('on');
      field.focus();
    });
  }

  function postNote() {
    if (!held || !field.value.trim() || (move && move.phase !== 'write')) return;
    writer.classList.remove('on'); field.blur();
    startMove(0.9, function () { return slitTarget(1.55); }, function () {          // lift above the slit
      startMove(0.9, function () { return slitTarget(0.5); }, function () {          // slide in edge-first
        var rx = (Math.random() - 0.5) * 0.9, rz = (Math.random() - 0.5) * 1.1, ry = Math.random() * Math.PI * 2;
        var restY = -0.975 + Math.min(inside.length, 40) * 0.013;
        startMove(0.7, function () { return boxTarget(rx, restY, rz, ry); }, function () {   // fall flat inside
          box.attach(held); inside.push(held); held = null;
          countEl.textContent = inside.length + (inside.length === 1 ? ' thing' : ' things') + ' inside \u00b7 tap the box to empty it';
        });
      });
    });
  }

  function putBack() {
    if (!held || (move && move.phase !== 'write')) return;
    writer.classList.remove('on'); field.blur();
    startMove(0.7, stackTopTarget, function () {
      held.material[2].dispose(); heldTex.dispose();
      held.material[2] = heldFaceOrig;
      stackGroup.attach(held);
      stackSheets.push(held); held = null;
    });
  }

  field.addEventListener('input', function () {
    drawNote(heldCanvas.getContext('2d'), heldHex, field.value);
    heldTex.needsUpdate = true;
    postBtn.disabled = !field.value.trim();
  });
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); postNote(); }
    else if (e.key === 'Escape') { e.preventDefault(); putBack(); }
  });
  postBtn.addEventListener('click', postNote);
  backBtn.addEventListener('click', putBack);

  function stackHit(e) {
    if (!stackSheets.length) return false;
    var r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    return raycaster.intersectObjects(stackSheets, false).length > 0;
  }
  // ---------- emptying the box: notes rise out through the slit and land on the floor, face up ----------
  function addTween(mesh, seconds, targetFn, opts) {
    opts = opts || {};
    tweens.push({ m: mesh, t0: performance.now() + (opts.delay || 0) * 1000, dur: seconds * 1000,
                  targetFn: targetFn, arc: opts.arc || 0, done: opts.done, started: false });
  }
  function stepTweens() {
    if (!tweens.length) return;
    var now = performance.now();
    tweens.slice().forEach(function (tw) {
      if (now < tw.t0) return;
      if (!tw.started) {
        scene.attach(tw.m);                                           // work in world space from here on
        tw.p = tw.m.position.clone(); tw.q = tw.m.quaternion.clone(); tw.s = tw.m.scale.x;
        tw.started = true;
      }
      var t = Math.min(1, (now - tw.t0) / tw.dur), k = ease(t), tg = tw.targetFn();
      tw.m.position.lerpVectors(tw.p, tg.p, k);
      tw.m.position.y += tw.arc * Math.sin(Math.PI * k);
      tw.m.quaternion.slerpQuaternions(tw.q, tg.q, k);
      tw.m.scale.setScalar(tw.s + (tg.s - tw.s) * k);
      if (t >= 1) {
        tweens.splice(tweens.indexOf(tw), 1);
        if (tw.done) tw.done();
      }
    });
  }
  function floorTarget(x, y, z, yaw) {
    world.updateMatrixWorld(true);
    return {
      p: world.localToWorld(new THREE.Vector3(x, y, z)),
      q: world.getWorldQuaternion(new THREE.Quaternion()).multiply(new THREE.Quaternion().setFromAxisAngle(Y_AXIS, yaw)),
      s: 1
    };
  }
  function landingSpot() {
    var x, z, tries = 0, ok;
    do {
      var r = 1.9 + Math.random() * 2.4, a = Math.random() * Math.PI * 2;
      x = Math.cos(a) * r; z = Math.sin(a) * r;
      ok = placed.every(function (q) { return Math.hypot(q[0] - x, q[1] - z) > 0.72; }) &&
           Math.hypot(x - STACK.x, z - STACK.z) > 1.1;
      tries++;
    } while (!ok && tries < 120);
    placed.push([x, z]);
    return { x: x, z: z, yaw: (Math.random() - 0.5) * 1.0 };
  }
  // where each emptied note sits on screen: a centred grid, locked to the camera
  function displaySlot(m, i, n) {
    camera.updateMatrixWorld();
    var D = 4.2;
    var vh = 2 * D * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), vw = vh * camera.aspect;
    var aw = vw * 0.92, ah = vh * 0.72;
    var cols = Math.max(1, Math.min(n, Math.round(Math.sqrt(n * aw / ah))));
    var rows = Math.ceil(n / cols);
    var cell = Math.min(aw / cols, ah / rows);
    var size = Math.min(cell * 0.92, vh * 0.42);
    var col = i % cols, row = Math.floor(i / cols);
    var inRow = (row === rows - 1) ? n - cols * (rows - 1) : cols;     // centre the last row
    var x = (col - (inRow - 1) / 2) * cell;
    var y = ((rows - 1) / 2 - row) * cell + vh * 0.06;
    return {
      p: camera.localToWorld(new THREE.Vector3(x, y, -D)),
      q: camera.quaternion.clone().multiply(qFace).multiply(new THREE.Quaternion().setFromAxisAngle(Y_AXIS, m.userData.tilt || 0)),
      s: size / 0.62
    };
  }
  function stepDisplay() {
    if (!displayMode) return;
    displayList.forEach(function (m, i) {
      if (!m.userData.locked) return;
      var d = displaySlot(m, i, displayList.length);
      m.position.copy(d.p); m.quaternion.copy(d.q); m.scale.setScalar(d.s);
    });
  }

  function emptyBox() {
    if (emptying || held || !inside.length) return;
    emptying = true;
    countEl.textContent = '';
    displayList = inside.splice(0);                                  // oldest first, in reading order
    var n = displayList.length, arrived = 0;
    displayList.forEach(function (m, i) {
      m.userData.tilt = (Math.random() - 0.5) * 0.12;
      m.userData.locked = false;
      addTween(m, 0.5, function () { return slitTarget(0.5); }, { delay: i * 0.2, done: function () {
        addTween(m, 0.6, function () { return slitTarget(1.7); }, { done: function () {          // up through the slit
          addTween(m, 0.9, function () { return displaySlot(m, i, n); }, {                        // and onto the screen
            arc: 0.4,
            done: function () {
              m.userData.locked = true;
              if (++arrived === n) { displayMode = true; shelf.classList.add('on'); }
            }
          });
        } });
      } });
    });
    displayMode = true;                                               // notes that have arrived follow the camera
  }

  function closeDisplay() {
    if (!displayMode || !displayList.length || shelf.className.indexOf('on') < 0) return;
    shelf.classList.remove('on');
    var remaining = displayList.length;
    displayList.forEach(function (m, i) {
      var land = landingSpot(), y = FLOOR + 0.02 + i * 0.002;
      m.userData.locked = false;
      addTween(m, 1.0, function () { return floorTarget(land.x, y, land.z, land.yaw); }, {
        arc: 0.9, delay: i * 0.05,
        done: function () {
          world.attach(m);
          if (--remaining === 0) {
            displayMode = false; displayList = []; emptying = false;
            countEl.textContent = 'the box is empty';
          }
        }
      });
    });
  }
  document.getElementById('close').addEventListener('click', closeDisplay);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDisplay(); });

  function boxHit(e) {
    var r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    return raycaster.intersectObjects(boxHitMeshes, false).length > 0;
  }

  canvas.addEventListener('pointerdown', function (e) { downX = e.clientX; downY = e.clientY; });
  canvas.addEventListener('pointerup', function (e) {
    if (held) return;
    if (emptying || Math.hypot(e.clientX - downX, e.clientY - downY) >= 6) return;           // only a tap, not a drag
    if (stackHit(e)) pickNote();
    else if (inside.length && boxHit(e)) emptyBox();
  });
  canvas.addEventListener('pointermove', function (e) {
    if (dragging) return;
    canvas.style.cursor = (!held && !emptying && (stackHit(e) || (inside.length && boxHit(e)))) ? 'pointer' : '';
  });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    if (w < h) dist = Math.max(dist, 10.5);
    camera.updateProjectionMatrix();
    placeCamera();
  }
  window.addEventListener('resize', resize);
  resize();

  function tick() {
    if (!dragging) {
      world.rotation.y += yawVel + idle;
      yawVel *= 0.95;
    }
    stepNote();
    stepTweens();
    stepDisplay();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
